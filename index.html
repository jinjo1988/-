<html lang="ko"><!--shell-->
<head><!--shell-->
<meta charset="utf-8"><!--shell-->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><!--shell-->
<meta name="theme-color" content="#EDF0F3"><!--shell-->
<link rel="manifest" href="manifest.webmanifest"><!--shell-->
<link rel="icon" href="icon.svg" type="image/svg+xml"><!--shell-->

<title>인터벌 운동 타이머</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen gym clock. Dial on top, steppers under it, thumb-reach controls at the bottom.
   While the timer runs, the whole screen floods with the phase color so it reads from across the room. */
:root {
  --bg: #EDF0F3;
  --surface: #FFFFFF;
  --ink: #14181D;
  --muted: #5A6470;
  --line: #D3D9E0;
  --work: #D33C22;
  --rest: #17707F;
  --prep: #A0670A;
  --done: #2E4A6B;
  --on-flood: #FFFFFF;
  --on-flood-dim: rgba(255, 255, 255, .74);
  --flood-track: rgba(255, 255, 255, .24);
  --flood-line: rgba(255, 255, 255, .55);

  --font-num: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;

  /* stage tokens, swapped per phase on body */
  --stage: var(--bg);
  --fg: var(--ink);
  --fg-dim: var(--muted);
  --track: var(--line);
  --prog: var(--work);
  --btn-bg: var(--work);
  --btn-fg: var(--on-flood);
  --btn2-line: var(--line);
  --btn2-fg: var(--ink);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1317; --surface: #191F26; --ink: #E7EBEF; --muted: #96A1AD; --line: #2B333C;
    --work: #C1361D; --rest: #125F6C; --prep: #8A5806; --done: #263F5C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1317; --surface: #191F26; --ink: #E7EBEF; --muted: #96A1AD; --line: #2B333C;
  --work: #C1361D; --rest: #125F6C; --prep: #8A5806; --done: #263F5C;
  color-scheme: dark;
}

body[data-phase="prep"], body[data-phase="work"], body[data-phase="rest"], body[data-phase="done"] {
  --fg: var(--on-flood);
  --fg-dim: var(--on-flood-dim);
  --track: var(--flood-track);
  --prog: var(--on-flood);
  --btn-bg: var(--on-flood);
  --btn2-line: var(--flood-line);
  --btn2-fg: var(--on-flood);
}
body[data-phase="prep"] { --stage: var(--prep); --btn-fg: var(--prep); }
body[data-phase="work"] { --stage: var(--work); --btn-fg: var(--work); }
body[data-phase="rest"] { --stage: var(--rest); --btn-fg: var(--rest); }
body[data-phase="done"] { --stage: var(--done); --btn-fg: var(--done); }

html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%;
  margin: 0;
  background: var(--stage);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.5;
  transition: background-color .35s ease;
  -webkit-tap-highlight-color: transparent;
}

.app {
  height: 100%;
  max-width: 520px;
  margin-inline: auto;
  padding-inline: 16px;
  display: grid;
  grid-template-rows: auto 1fr auto;
}

/* top bar */
.bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-block: 12px;
}
.brand {
  font-family: var(--font-num);
  font-weight: 600;
  font-size: 15px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--fg-dim);
}
.brand b { color: var(--fg); font-weight: 700; }
.toggles { display: flex; gap: 8px; }
.toggle {
  font: 500 13px/1 var(--font-ui);
  color: var(--fg-dim);
  background: transparent;
  border: 1px solid var(--btn2-line);
  border-radius: 999px;
  padding: 8px 12px;
  cursor: pointer;
}
.toggle[aria-pressed="true"] { color: var(--fg); }

/* stage */
.stage {
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
  padding-block: 4px 16px;
}
body[data-status="running"] .stage,
body[data-status="paused"] .stage,
body[data-status="done"] .stage { justify-content: center; }

.dial {
  --dial: min(58vw, 34vh, 250px);
  position: relative;
  width: var(--dial);
  max-width: 100%;
  aspect-ratio: 1;
  flex: none;
  transition: width .35s ease;
}
body:not([data-status="idle"]) .dial { --dial: min(86vw, 52vh, 420px); }
.ring { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
.ring circle { fill: none; stroke-width: 7; }
.ring .track { stroke: var(--track); }
.ring .prog { stroke: var(--prog); stroke-linecap: round; transition: stroke .35s ease; }

.readout {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}
.phase {
  font-family: var(--font-ui);
  font-weight: 600;
  font-size: calc(var(--dial) * .085);
  letter-spacing: .04em;
  line-height: 1.2;
  max-width: 78%;
  overflow-wrap: anywhere;
  text-wrap: balance;
}
.digits {
  font-family: var(--font-num);
  font-weight: 600;
  font-size: calc(var(--dial) * .4);
  line-height: .95;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.01em;
}
.digits.long { font-size: calc(var(--dial) * .3); }
.sub {
  font-size: calc(var(--dial) * .062);
  color: var(--fg-dim);
  font-variant-numeric: tabular-nums;
  margin-top: .3em;
}
body[data-status="paused"] .digits { animation: blink 1.2s steps(2, jump-none) infinite; }
@keyframes blink { 50% { opacity: .35; } }

/* set segments */
.setbar {
  width: min(100%, 420px);
  display: flex;
  gap: 4px;
}
.setbar span {
  flex: 1;
  height: 8px;
  border-radius: 2px;
  background: var(--track);
}
.setbar span.done { background: var(--fg); }
.setbar span.now { background: var(--fg-dim); }
.meta {
  font-size: 15px;
  color: var(--fg-dim);
  font-variant-numeric: tabular-nums;
  text-align: center;
  text-wrap: balance;
}
.meta strong { color: var(--fg); font-weight: 600; }

/* settings */
.settings {
  width: 100%;
  display: grid;
  gap: 14px;
}
.presets {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.chip {
  font: 500 13px/1.2 var(--font-ui);
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 8px 12px;
  cursor: pointer;
}
.chip small { color: var(--muted); font-size: 12px; margin-left: 4px; font-variant-numeric: tabular-nums; }
.chip:hover { border-color: var(--muted); }
.fields {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.field {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px;
  display: grid;
  gap: 8px;
  min-width: 0;
}
.field.work { box-shadow: inset 0 3px 0 var(--work); }
.field.rest { box-shadow: inset 0 3px 0 var(--rest); }
.field.prep { box-shadow: inset 0 3px 0 var(--prep); }
.field.sets { box-shadow: inset 0 3px 0 var(--ink); }
.field label {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 6px;
  font-weight: 600;
  font-size: 14px;
}
.field label span {
  font-weight: 400;
  font-size: 12px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.stepper {
  display: grid;
  grid-template-columns: 40px minmax(0, 1fr) 40px;
  align-items: center;
  gap: 6px;
}
.stepper button {
  height: 40px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--ink);
  font: 600 22px/1 var(--font-num);
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}
.stepper button:active { background: var(--line); }
.stepper input {
  width: 100%;
  min-width: 0;
  text-align: center;
  font: 600 30px/1 var(--font-num);
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  background: transparent;
  border: 0;
  border-bottom: 2px solid transparent;
  padding: 2px 0;
  -moz-appearance: textfield;
  appearance: textfield;
}
.stepper input::-webkit-outer-spin-button,
.stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.stepper input:focus { outline: none; border-bottom-color: var(--work); }

/* controls */
.controls {
  display: flex;
  gap: 10px;
  padding-block: 12px 18px;
}
.btn {
  flex: 1;
  min-height: 60px;
  border-radius: 16px;
  font: 600 18px/1 var(--font-ui);
  letter-spacing: .02em;
  cursor: pointer;
  touch-action: manipulation;
}
.btn.primary {
  flex: 2;
  background: var(--btn-bg);
  color: var(--btn-fg);
  border: 0;
  font-size: 20px;
}
.btn.secondary {
  background: transparent;
  color: var(--btn2-fg);
  border: 1.5px solid var(--btn2-line);
}
button:focus-visible, .chip:focus-visible {
  outline: 3px solid var(--fg);
  outline-offset: 2px;
}

/* mode tabs */
.tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  padding: 4px;
  background: var(--line);
  border-radius: 12px;
}
.tab {
  font: 600 15px/1 var(--font-ui);
  padding: 11px;
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
}
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); }

/* routine list */
.routine { display: grid; gap: 8px; }
.routine-head, .item {
  display: grid;
  grid-template-columns: 20px minmax(0, 1fr) 58px 58px 32px;
  gap: 6px;
  align-items: center;
}
.routine-head {
  font-size: 12px;
  color: var(--muted);
  padding-inline: 8px 6px;
  text-align: center;
}
.routine-head span:nth-child(2) { text-align: left; }
.items { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.item {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 6px 6px 6px 8px;
}
.item .num {
  font: 600 16px/1 var(--font-num);
  color: var(--muted);
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.item input {
  width: 100%;
  min-width: 0;
  font: 500 15px/1.2 var(--font-ui);
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px 8px;
}
.item input[type="number"] {
  font: 600 20px/1 var(--font-num);
  text-align: center;
  padding: 7px 2px;
  -moz-appearance: textfield;
  appearance: textfield;
}
.item input::-webkit-outer-spin-button,
.item input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.item input:focus { outline: 2px solid var(--work); outline-offset: -1px; }
.item .del {
  height: 36px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--muted);
  font-size: 20px;
  cursor: pointer;
}
.item .del:disabled { opacity: .3; cursor: default; }
.add {
  border: 1.5px dashed var(--line);
  background: transparent;
  color: var(--ink);
  border-radius: 12px;
  padding: 12px;
  font: 600 14px/1 var(--font-ui);
  cursor: pointer;
}

/* saved settings */
.mine { display: grid; gap: 10px; }
.section-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  font-weight: 600;
  font-size: 14px;
}
.link-btn {
  font: 600 13px/1 var(--font-ui);
  color: var(--ink);
  background: transparent;
  border: 0;
  padding: 6px 0;
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
}
.save-form { display: flex; gap: 6px; }
.save-form input {
  flex: 1;
  min-width: 0;
  font: 500 15px/1.2 var(--font-ui);
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px;
}
.save-form input:focus { outline: 2px solid var(--work); outline-offset: -1px; }
.mini {
  font: 600 14px/1 var(--font-ui);
  border-radius: 10px;
  padding: 0 14px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
}
.mini.primary { background: var(--work); border-color: var(--work); color: var(--on-flood); }
.mine-list { display: flex; flex-wrap: wrap; gap: 8px; }
.saved {
  display: inline-flex;
  align-items: stretch;
  max-width: 100%;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 999px;
  overflow: hidden;
}
.saved .chip { border: 0; border-radius: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.saved .x {
  border: 0;
  border-left: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
  padding: 0 12px;
  font: 500 13px/1 var(--font-ui);
  cursor: pointer;
  white-space: nowrap;
}
.saved .x.armed { background: var(--work); color: var(--on-flood); }
.empty { margin: 0; font-size: 13px; color: var(--muted); }

@media (max-height: 640px) {
  .dial { --dial: min(50vw, 30vh, 200px); }
  .stage { gap: 12px; }
  .btn { min-height: 52px; }
}
@media (prefers-reduced-motion: reduce) {
  body, .dial, .ring .prog { transition: none; }
  body[data-status="paused"] .digits { animation: none; opacity: .6; }
}
</style>
</head><!--shell-->
<body data-phase="idle" data-status="idle"><!--shell-->
<div class="app">
  <header class="bar">
    <div class="brand"><b>Interval</b> Timer</div>
    <div class="toggles">
      <button class="toggle" id="voiceBtn" type="button" aria-pressed="true">음성 켜짐</button>
      <button class="toggle" id="soundBtn" type="button" aria-pressed="true">소리 켜짐</button>
    </div>
  </header>

  <main class="stage">
    <div class="dial">
      <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
        <circle class="track" cx="100" cy="100" r="92"></circle>
        <circle class="prog" id="prog" cx="100" cy="100" r="92"></circle>
      </svg>
      <div class="readout" role="timer" aria-live="off">
        <div class="phase" id="phaseLabel">전체 시간</div>
        <div class="digits" id="digits">5:15</div>
        <div class="sub" id="subLabel">8세트</div>
      </div>
    </div>

    <div class="setbar" id="setsBar" hidden></div>
    <div class="meta" id="meta"></div>

    <section class="settings" id="settings" aria-label="타이머 설정">
      <div class="tabs" role="tablist" aria-label="타이머 방식">
        <button class="tab" type="button" role="tab" id="tab-simple" data-mode="simple" aria-selected="true">간단</button>
        <button class="tab" type="button" role="tab" id="tab-routine" data-mode="routine" aria-selected="false">루틴</button>
      </div>

      <div class="presets" id="presets" data-only="simple"></div>

      <div class="routine" id="routine" data-only="routine">
        <div class="presets" id="rpresets"></div>
        <div class="routine-head" aria-hidden="true">
          <span></span><span>운동 이름</span><span>운동(초)</span><span>휴식(초)</span><span></span>
        </div>
        <ol class="items" id="items"></ol>
        <button class="add" id="addItem" type="button">+ 운동 추가</button>
      </div>

      <div class="fields">
        <div class="field work" data-only="simple">
          <label for="f-work">운동 <span id="h-work">초</span></label>
          <div class="stepper" data-field="work">
            <button type="button" data-dir="-1" aria-label="운동 시간 줄이기">−</button>
            <input id="f-work" type="number" inputmode="numeric" min="1" max="3600">
            <button type="button" data-dir="1" aria-label="운동 시간 늘리기">+</button>
          </div>
        </div>
        <div class="field rest" data-only="simple">
          <label for="f-rest">휴식 <span id="h-rest">초</span></label>
          <div class="stepper" data-field="rest">
            <button type="button" data-dir="-1" aria-label="휴식 시간 줄이기">−</button>
            <input id="f-rest" type="number" inputmode="numeric" min="0" max="3600">
            <button type="button" data-dir="1" aria-label="휴식 시간 늘리기">+</button>
          </div>
        </div>
        <div class="field sets" data-only="simple">
          <label for="f-sets">세트 <span id="h-sets">회</span></label>
          <div class="stepper" data-field="sets">
            <button type="button" data-dir="-1" aria-label="세트 수 줄이기">−</button>
            <input id="f-sets" type="number" inputmode="numeric" min="1" max="99">
            <button type="button" data-dir="1" aria-label="세트 수 늘리기">+</button>
          </div>
        </div>
        <div class="field sets" data-only="routine">
          <label for="f-rounds">반복 <span id="h-rounds">라운드</span></label>
          <div class="stepper" data-field="rounds">
            <button type="button" data-dir="-1" aria-label="라운드 수 줄이기">−</button>
            <input id="f-rounds" type="number" inputmode="numeric" min="1" max="20">
            <button type="button" data-dir="1" aria-label="라운드 수 늘리기">+</button>
          </div>
        </div>
        <div class="field prep">
          <label for="f-prep">준비 <span id="h-prep">초</span></label>
          <div class="stepper" data-field="prep">
            <button type="button" data-dir="-1" aria-label="준비 시간 줄이기">−</button>
            <input id="f-prep" type="number" inputmode="numeric" min="0" max="60">
            <button type="button" data-dir="1" aria-label="준비 시간 늘리기">+</button>
          </div>
        </div>
      </div>

      <div class="mine">
        <div class="section-head">
          <span>내 설정</span>
          <button class="link-btn" id="saveOpen" type="button">+ 지금 설정 저장</button>
        </div>
        <form class="save-form" id="saveForm" hidden>
          <input id="saveName" type="text" maxlength="16" placeholder="이름 (예: 하체 루틴)" aria-label="저장할 이름">
          <button class="mini primary" type="submit">저장</button>
          <button class="mini" id="saveCancel" type="button">취소</button>
        </form>
        <div class="mine-list" id="mineList"></div>
        <p class="empty" id="mineEmpty">자주 쓰는 설정을 저장해 두면 여기서 바로 불러올 수 있어요.</p>
      </div>
    </section>
  </main>

  <footer class="controls">
    <button class="btn secondary" id="resetBtn" type="button" hidden>초기화</button>
    <button class="btn primary" id="primaryBtn" type="button">시작</button>
    <button class="btn secondary" id="skipBtn" type="button" hidden>건너뛰기</button>
  </footer>
</div>

<script>
(() => {
  "use strict";

  const STORE_KEY = "interval-timer:v1";
  const FIELDS = {
    work: { min: 1, max: 3600, step: 5 },
    rest: { min: 0, max: 3600, step: 5 },
    sets: { min: 1, max: 99, step: 1 },
    rounds: { min: 1, max: 20, step: 1 },
    prep: { min: 0, max: 60, step: 5 },
  };
  const ITEM = { work: { min: 1, max: 3600 }, rest: { min: 0, max: 3600 }, name: 12, max: 20 };
  const DEFAULTS = {
    mode: "simple", work: 30, rest: 10, sets: 8, rounds: 3, prep: 5,
    items: [
      { name: "스쿼트", work: 40, rest: 15 },
      { name: "푸시업", work: 30, rest: 15 },
      { name: "플랭크", work: 60, rest: 30 },
    ],
  };
  const PRESETS = [
    { name: "타바타", v: { work: 20, rest: 10, sets: 8 } },
    { name: "HIIT", v: { work: 40, rest: 20, sets: 10 } },
    { name: "서킷", v: { work: 60, rest: 30, sets: 5 } },
    { name: "플랭크", v: { work: 45, rest: 15, sets: 4 } },
  ];
  const ROUTINES = [
    { name: "전신", v: { rounds: 3, items: [
      { name: "스쿼트", work: 40, rest: 15 }, { name: "푸시업", work: 30, rest: 15 },
      { name: "런지", work: 40, rest: 15 }, { name: "플랭크", work: 45, rest: 30 } ] } },
    { name: "코어", v: { rounds: 3, items: [
      { name: "크런치", work: 30, rest: 10 }, { name: "레그레이즈", work: 30, rest: 10 },
      { name: "플랭크", work: 45, rest: 15 }, { name: "바이시클", work: 30, rest: 20 } ] } },
    { name: "하체", v: { rounds: 4, items: [
      { name: "스쿼트", work: 45, rest: 15 }, { name: "점프 스쿼트", work: 30, rest: 15 },
      { name: "월싯", work: 45, rest: 30 } ] } },
  ];
  const PHASE_NAME = { prep: "준비", work: "운동", rest: "휴식" };
  const C = 2 * Math.PI * 92;

  const $ = (id) => document.getElementById(id);
  const body = document.body;
  const el = {
    prog: $("prog"), phase: $("phaseLabel"), digits: $("digits"), sub: $("subLabel"),
    sets: $("setsBar"), meta: $("meta"), settings: $("settings"), presets: $("presets"),
    rpresets: $("rpresets"), items: $("items"), addItem: $("addItem"),
    mineList: $("mineList"), mineEmpty: $("mineEmpty"), saveOpen: $("saveOpen"),
    saveForm: $("saveForm"), saveName: $("saveName"), saveCancel: $("saveCancel"),
    primary: $("primaryBtn"), skip: $("skipBtn"), reset: $("resetBtn"), sound: $("soundBtn"),
    voice: $("voiceBtn"),
  };
  const themeMeta = document.querySelector('meta[name="theme-color"]');
  el.prog.style.strokeDasharray = C;

  /* ---------- config ---------- */
  function num(v, min, max, fallback) {
    const n = Math.round(Number(v));
    if (!Number.isFinite(n)) return fallback;
    return Math.min(max, Math.max(min, n));
  }
  function clamp(f, v) { return num(v, FIELDS[f].min, FIELDS[f].max, DEFAULTS[f]); }
  function cleanItem(it, i) {
    it = it || {};
    const name = String(it.name || "").trim().slice(0, ITEM.name) || "운동 " + (i + 1);
    return {
      name,
      work: num(it.work, ITEM.work.min, ITEM.work.max, 30),
      rest: num(it.rest, ITEM.rest.min, ITEM.rest.max, 15),
    };
  }
  function cleanCfg(src) {
    src = src || {};
    const c = { mode: src.mode === "routine" ? "routine" : "simple" };
    for (const f in FIELDS) c[f] = clamp(f, src[f] != null ? src[f] : DEFAULTS[f]);
    const items = Array.isArray(src.items) && src.items.length ? src.items : DEFAULTS.items;
    c.items = items.slice(0, ITEM.max).map(cleanItem);
    return c;
  }
  function copyCfg(c) { return JSON.parse(JSON.stringify(c)); }

  /* ---------- storage ---------- */
  function readStore() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; }
  }
  function writeStore() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify({ cfg, mine, soundOn, voiceOn })); } catch (e) {}
  }
  const saved = readStore();
  const cfg = cleanCfg(saved.cfg);
  let mine = Array.isArray(saved.mine)
    ? saved.mine.filter((m) => m && m.cfg).map((m) => ({ id: String(m.id || Math.random()), name: String(m.name || "내 설정").slice(0, 16), cfg: cleanCfg(m.cfg) }))
    : [];
  let soundOn = saved.soundOn !== false;
  let voiceOn = saved.voiceOn !== false;

  /* ---------- formatting ---------- */
  function clock(sec) {
    const m = Math.floor(sec / 60), s = sec % 60;
    return m + ":" + String(s).padStart(2, "0");
  }
  function big(sec) { return sec < 60 ? String(sec) : clock(sec); }
  function words(sec) {
    const m = Math.floor(sec / 60), s = sec % 60;
    if (!m) return s + "초";
    return s ? m + "분 " + s + "초" : m + "분";
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  }
  function summary(c) {
    return c.mode === "routine"
      ? "운동 " + c.items.length + "개 ×" + c.rounds
      : c.work + "/" + c.rest + " ×" + c.sets;
  }

  /* ---------- phases ---------- */
  // step = which work block this belongs to (1-based), used by the progress segments
  function buildPhases(c) {
    const list = [];
    if (c.prep > 0) list.push({ type: "prep", ms: c.prep * 1000, step: 0 });
    if (c.mode === "routine") {
      const n = c.items.length;
      let step = 0;
      for (let r = 1; r <= c.rounds; r++) {
        c.items.forEach((it, j) => {
          step++;
          list.push({ type: "work", ms: it.work * 1000, name: it.name, round: r, item: j + 1, step });
          const last = r === c.rounds && j === n - 1;
          if (!last && it.rest > 0) list.push({ type: "rest", ms: it.rest * 1000, round: r, item: j + 1, step });
        });
      }
    } else {
      for (let i = 1; i <= c.sets; i++) {
        list.push({ type: "work", ms: c.work * 1000, step: i });
        if (i < c.sets && c.rest > 0) list.push({ type: "rest", ms: c.rest * 1000, step: i });
      }
    }
    return list;
  }
  function totalSec(c) { return buildPhases(c).reduce((a, p) => a + p.ms, 0) / 1000; }
  function workCount(c) { return c.mode === "routine" ? c.rounds * c.items.length : c.sets; }
  function title(p) { return p.type === "work" && p.name ? p.name : PHASE_NAME[p.type]; }

  /* ---------- sound / vibration / wake lock ---------- */
  let ctx = null;
  function ensureAudio() {
    if (!soundOn) return;
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === "suspended") ctx.resume();
    } catch (e) { ctx = null; }
  }
  function tone(freq, dur, when = 0, vol = 0.3) {
    if (!soundOn || !ctx) return;
    try {
      const t = ctx.currentTime + when;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "triangle";
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(ctx.destination);
      o.start(t);
      o.stop(t + dur + 0.03);
    } catch (e) {}
  }
  function buzz(pattern) { try { navigator.vibrate && navigator.vibrate(pattern); } catch (e) {} }
  /* ---------- voice ---------- */
  const synth = "speechSynthesis" in window ? window.speechSynthesis : null;
  const COUNT = ["하나", "둘", "셋"];
  let koVoice = null;
  function pickVoice() {
    try {
      const ko = synth.getVoices().filter((v) => /^ko/i.test(v.lang));
      koVoice = ko.find((v) => v.localService) || ko[0] || null;
    } catch (e) { koVoice = null; }
  }
  if (synth) {
    pickVoice();
    try { synth.addEventListener("voiceschanged", pickVoice); } catch (e) { synth.onvoiceschanged = pickVoice; }
  }
  function hush() { try { synth && synth.cancel(); } catch (e) {} }
  function say(text) {
    if (!voiceOn || !synth) return;
    try {
      // newest line wins so the countdown never lags behind a longer announcement
      synth.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "ko-KR";
      if (koVoice) u.voice = koVoice;
      u.rate = 1.1;
      synth.speak(u);
    } catch (e) {}
  }
  function announce(p) {
    if (p.type === "prep") { say("준비하세요"); return; }
    const routine = cfg.mode === "routine";
    if (p.type === "work") {
      if (!routine) {
        say(p.step === cfg.sets && cfg.sets > 1 ? "마지막 세트, 운동 시작" : p.step + "세트 운동 시작");
      } else {
        let line = p.name + " 시작";
        if (p.item === 1 && cfg.rounds > 1) line = (p.round === cfg.rounds ? "마지막 라운드. " : p.round + "라운드. ") + line;
        say(line);
      }
    } else if (p.type === "rest") {
      const next = phases[idx + 1];
      say("휴식 " + words(p.ms / 1000) + ". 다음은 " + (routine ? (next && next.name) || "" : (p.step + 1) + "세트"));
    }
  }
  // spoken checkpoints inside a phase, keyed by seconds left
  function checkpoint(p, sec) {
    if (sec >= 1 && sec <= 3 && p.ms >= 4000) return COUNT[sec - 1];
    if (p.type !== "work") return null;
    if (p.ms >= 30000 && sec === 10) return "10초 남았어요";
    if (p.ms >= 20000 && sec === Math.ceil(p.ms / 2000)) return "절반 지났어요";
    return null;
  }

  const cue = {
    tick() { if (voiceOn && synth) buzz(60); else { tone(740, 0.12); buzz(60); } },
    work() { tone(988, 0.18); tone(988, 0.4, 0.22); buzz([200, 80, 200]); },
    rest() { tone(523, 0.5); buzz(400); },
    prep() { tone(660, 0.25); },
    done() { tone(784, 0.16); tone(988, 0.16, 0.18); tone(1319, 0.6, 0.36); buzz([150, 80, 150, 80, 400]); },
  };

  let wakeLock = null;
  async function holdScreen() {
    try {
      if ("wakeLock" in navigator && !wakeLock) {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", () => { wakeLock = null; });
      }
    } catch (e) { wakeLock = null; }
  }
  function releaseScreen() {
    try { wakeLock && wakeLock.release(); } catch (e) {}
    wakeLock = null;
  }

  /* ---------- timer state ---------- */
  let status = "idle";        // idle | running | paused | done
  let phases = [];
  let idx = 0;
  let endAt = 0;              // performance.now() timestamp when current phase ends
  let left = 0;               // ms left in the phase while paused
  let lastSec = null;
  let raf = 0, iv = 0;

  function onPhaseStart() {
    const p = phases[idx];
    lastSec = Math.ceil(p.ms / 1000);
    cue[p.type]();
    announce(p);
  }

  function start() {
    ensureAudio();
    phases = buildPhases(cfg);
    idx = 0;
    endAt = performance.now() + phases[0].ms;
    status = "running";
    buildSetBar();
    onPhaseStart();
    holdScreen();
    loop();
  }

  function pause() {
    left = Math.max(0, endAt - performance.now());
    status = "paused";
    stopLoop();
    hush();
    releaseScreen();
    render();
  }

  function resume() {
    ensureAudio();
    endAt = performance.now() + left;
    status = "running";
    holdScreen();
    loop();
  }

  function skip() {
    if (idx + 1 >= phases.length) { finish(); return; }
    idx++;
    if (status === "running") {
      endAt = performance.now() + phases[idx].ms;
      onPhaseStart();
    } else {
      left = phases[idx].ms;
      lastSec = Math.ceil(left / 1000);
      render();
    }
  }

  function finish() {
    status = "done";
    stopLoop();
    releaseScreen();
    cue.done();
    say("운동 완료. 수고했어요");
    render();
  }

  function reset() {
    status = "idle";
    stopLoop();
    hush();
    releaseScreen();
    render();
  }

  function loop() {
    stopLoop();
    const frame = () => { tick(); if (status === "running") raf = requestAnimationFrame(frame); };
    raf = requestAnimationFrame(frame);
    // requestAnimationFrame stops in background tabs; the interval keeps phase changes and beeps going
    iv = setInterval(tick, 250);
    tick();
  }
  function stopLoop() { cancelAnimationFrame(raf); clearInterval(iv); }

  function tick() {
    if (status !== "running") return;
    const now = performance.now();
    while (now >= endAt) {
      if (idx + 1 >= phases.length) { finish(); return; }
      idx++;
      endAt += phases[idx].ms;
      onPhaseStart();
    }
    const sec = Math.ceil((endAt - now) / 1000);
    if (sec !== lastSec) {
      const p = phases[idx];
      if (sec <= 3 && sec >= 1 && p.ms >= 4000) cue.tick();
      const line = checkpoint(p, sec);
      if (line) say(line);
      lastSec = sec;
    }
    render(now);
  }

  /* ---------- rendering ---------- */
  function buildSetBar() {
    el.sets.textContent = "";
    const n = workCount(cfg);
    if (n > 40) return;
    for (let i = 0; i < n; i++) el.sets.appendChild(document.createElement("span"));
  }

  function setRing(frac) { el.prog.style.strokeDashoffset = C * (1 - frac); }

  function setDigits(text) {
    el.digits.textContent = text;
    el.digits.classList.toggle("long", text.length > 4);
  }

  let shownPhase = "";
  function setPhase(name) {
    body.dataset.phase = name;
    if (name === shownPhase) return;
    shownPhase = name;
    // match the phone's status bar to the stage color when installed as an app
    if (themeMeta) {
      const color = getComputedStyle(body).getPropertyValue("--stage").trim();
      if (color) themeMeta.setAttribute("content", color);
    }
  }

  function render(now) {
    body.dataset.status = status;
    const idle = status === "idle";
    const routine = cfg.mode === "routine";
    el.settings.hidden = !idle;
    el.sets.hidden = idle || status === "done" || !el.sets.childElementCount;
    el.reset.hidden = !(status === "paused" || status === "done");
    el.skip.hidden = !(status === "running" || status === "paused");

    if (idle) {
      setPhase("idle");
      el.phase.textContent = "전체 시간";
      setDigits(clock(totalSec(cfg)));
      if (routine) {
        el.sub.textContent = cfg.rounds + "라운드 · 운동 " + cfg.items.length + "개";
        el.meta.innerHTML = cfg.items.map((it) => esc(it.name)).join(" → ") +
          " × <strong>" + cfg.rounds + "라운드</strong>";
      } else {
        el.sub.textContent = cfg.sets + "세트";
        el.meta.innerHTML = "운동 <strong>" + words(cfg.work) + "</strong> · 휴식 <strong>" +
          (cfg.rest ? words(cfg.rest) : "없음") + "</strong> × <strong>" + cfg.sets + "세트</strong>";
      }
      setRing(1);
      el.primary.textContent = "시작";
      return;
    }

    if (status === "done") {
      setPhase("done");
      el.phase.textContent = "완료";
      setDigits(clock(totalSec(cfg)));
      el.sub.textContent = routine ? cfg.rounds + "라운드 끝" : cfg.sets + "세트 끝";
      el.meta.textContent = "수고했어요. 같은 설정으로 다시 하려면 아래 버튼을 누르세요.";
      setRing(1);
      el.primary.textContent = "다시 시작";
      return;
    }

    const p = phases[idx];
    const ms = status === "running" ? Math.max(0, endAt - (now || performance.now())) : left;
    const sec = Math.ceil(ms / 1000);
    setPhase(p.type);
    el.phase.textContent = status === "paused" ? title(p) + " · 일시정지" : title(p);
    setDigits(big(sec));
    if (p.type === "prep") el.sub.textContent = "곧 시작합니다";
    else if (routine) el.sub.textContent = p.round + " / " + cfg.rounds + " 라운드 · " + p.item + " / " + cfg.items.length;
    else el.sub.textContent = "세트 " + p.step + " / " + cfg.sets;
    setRing(p.ms ? ms / p.ms : 0);

    let rest = ms;
    for (let i = idx + 1; i < phases.length; i++) rest += phases[i].ms;
    const next = phases[idx + 1];
    el.meta.innerHTML = "남은 시간 <strong>" + clock(Math.ceil(rest / 1000)) + "</strong> · " +
      (next ? "다음 <strong>" + esc(title(next)) + " " + words(next.ms / 1000) + "</strong>" : "<strong>마지막 구간</strong>");

    const segs = el.sets.children;
    for (let i = 0; i < segs.length; i++) {
      const n = i + 1;
      const done = p.type === "rest" ? n <= p.step : p.type === "work" ? n < p.step : false;
      segs[i].className = done ? "done" : (p.type === "work" && n === p.step ? "now" : "");
    }

    el.primary.textContent = status === "running" ? "일시정지" : "계속";
  }

  /* ---------- settings: fields ---------- */
  function syncInputs() {
    for (const f in FIELDS) {
      $("f-" + f).value = cfg[f];
      const hint = $("h-" + f);
      if (f === "sets") hint.textContent = "회";
      else if (f === "rounds") hint.textContent = "라운드";
      else hint.textContent = cfg[f] >= 60 ? words(cfg[f]) : cfg[f] === 0 ? "안 함" : "초";
    }
  }
  function changed() {
    writeStore();
    render();
  }
  function setField(f, v) {
    cfg[f] = clamp(f, v);
    syncInputs();
    changed();
  }

  function syncMode() {
    document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", String(t.dataset.mode === cfg.mode)));
    document.querySelectorAll("[data-only]").forEach((n) => { n.hidden = n.dataset.only !== cfg.mode; });
  }
  function syncSettings() {
    syncMode();
    syncInputs();
    renderItems();
  }

  document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => {
    cfg.mode = t.dataset.mode;
    syncMode();
    changed();
  }));

  function chip(label, small, onClick) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.textContent = label;
    const s = document.createElement("small");
    s.textContent = small;
    b.appendChild(s);
    b.addEventListener("click", onClick);
    return b;
  }

  PRESETS.forEach((p) => {
    el.presets.appendChild(chip(p.name, p.v.work + "/" + p.v.rest + " ×" + p.v.sets, () => {
      Object.assign(cfg, p.v);
      syncInputs();
      changed();
    }));
  });
  ROUTINES.forEach((p) => {
    el.rpresets.appendChild(chip(p.name, p.v.items.length + "개 ×" + p.v.rounds, () => {
      cfg.rounds = p.v.rounds;
      cfg.items = copyCfg(p.v.items);
      syncSettings();
      changed();
    }));
  });

  document.querySelectorAll(".stepper").forEach((st) => {
    const f = st.dataset.field;
    const input = st.querySelector("input");
    input.addEventListener("change", () => setField(f, input.value));
    input.addEventListener("focus", () => input.select());

    st.querySelectorAll("button").forEach((btn) => {
      const dir = Number(btn.dataset.dir);
      const step = () => {
        const s = FIELDS[f].step;
        // snap to the step grid so 7 + 5 gives 10, not 12
        const base = dir > 0 ? Math.floor(cfg[f] / s) * s : Math.ceil(cfg[f] / s) * s;
        setField(f, base + dir * s);
      };
      let hold = 0, rep = 0;
      const stop = () => { clearTimeout(hold); clearInterval(rep); };
      btn.addEventListener("pointerdown", (e) => {
        if (e.button !== 0) return;
        step();
        hold = setTimeout(() => { rep = setInterval(step, 90); }, 400);
      });
      ["pointerup", "pointerleave", "pointercancel"].forEach((t) => btn.addEventListener(t, stop));
      // keyboard activation arrives as a click with detail 0
      btn.addEventListener("click", (e) => { if (e.detail === 0) step(); });
    });
  });

  /* ---------- settings: routine list ---------- */
  function numInput(value, lim, label, onSet) {
    const inp = document.createElement("input");
    inp.type = "number";
    inp.inputMode = "numeric";
    inp.min = lim.min;
    inp.max = lim.max;
    inp.value = value;
    inp.setAttribute("aria-label", label);
    inp.addEventListener("focus", () => inp.select());
    inp.addEventListener("change", () => {
      const v = num(inp.value, lim.min, lim.max, value);
      inp.value = v;
      onSet(v);
    });
    return inp;
  }

  function renderItems() {
    el.items.textContent = "";
    cfg.items.forEach((it, i) => {
      const li = document.createElement("li");
      li.className = "item";

      const n = document.createElement("span");
      n.className = "num";
      n.textContent = i + 1;

      const name = document.createElement("input");
      name.type = "text";
      name.id = "item-name-" + i;
      name.maxLength = ITEM.name;
      name.value = it.name;
      name.setAttribute("aria-label", (i + 1) + "번 운동 이름");
      name.addEventListener("input", () => { it.name = name.value.trim() || "운동 " + (i + 1); changed(); });
      name.addEventListener("blur", () => { name.value = it.name; });

      const work = numInput(it.work, ITEM.work, (i + 1) + "번 운동 시간(초)", (v) => { it.work = v; changed(); });
      work.id = "item-work-" + i;
      const rest = numInput(it.rest, ITEM.rest, (i + 1) + "번 운동 뒤 휴식(초)", (v) => { it.rest = v; changed(); });
      rest.id = "item-rest-" + i;

      const del = document.createElement("button");
      del.type = "button";
      del.className = "del";
      del.textContent = "×";
      del.disabled = cfg.items.length <= 1;
      del.setAttribute("aria-label", it.name + " 빼기");
      del.addEventListener("click", () => {
        cfg.items.splice(i, 1);
        renderItems();
        changed();
      });

      li.append(n, name, work, rest, del);
      el.items.appendChild(li);
    });
    el.addItem.hidden = cfg.items.length >= ITEM.max;
  }

  el.addItem.addEventListener("click", () => {
    const prev = cfg.items[cfg.items.length - 1];
    cfg.items.push({ name: "운동 " + (cfg.items.length + 1), work: prev ? prev.work : 30, rest: prev ? prev.rest : 15 });
    renderItems();
    changed();
    const inp = $("item-name-" + (cfg.items.length - 1));
    if (inp) { inp.focus(); inp.select(); }
  });

  /* ---------- settings: saved ---------- */
  function renderMine() {
    el.mineList.textContent = "";
    el.mineEmpty.hidden = mine.length > 0;
    mine.forEach((m) => {
      const wrap = document.createElement("span");
      wrap.className = "saved";
      wrap.appendChild(chip(m.name, summary(m.cfg), () => {
        Object.assign(cfg, cleanCfg(m.cfg));
        syncSettings();
        changed();
      }));
      const x = document.createElement("button");
      x.type = "button";
      x.className = "x";
      x.textContent = "×";
      x.setAttribute("aria-label", m.name + " 삭제");
      // two taps to delete, since the page cannot show a confirm dialog
      let armed = 0;
      x.addEventListener("click", () => {
        if (!armed) {
          x.classList.add("armed");
          x.textContent = "삭제";
          armed = setTimeout(() => { armed = 0; x.classList.remove("armed"); x.textContent = "×"; }, 3000);
          return;
        }
        clearTimeout(armed);
        mine = mine.filter((k) => k.id !== m.id);
        writeStore();
        renderMine();
      });
      wrap.appendChild(x);
      el.mineList.appendChild(wrap);
    });
  }

  function defaultName() {
    if (cfg.mode === "routine") {
      const names = cfg.items.slice(0, 2).map((it) => it.name).join("·");
      return cfg.items.length > 2 ? names + " 외" : names;
    }
    return summary(cfg);
  }

  el.saveOpen.addEventListener("click", () => {
    el.saveForm.hidden = false;
    el.saveOpen.hidden = true;
    el.saveName.value = "";
    el.saveName.placeholder = defaultName();
    el.saveName.focus();
  });
  function closeSave() {
    el.saveForm.hidden = true;
    el.saveOpen.hidden = false;
  }
  el.saveCancel.addEventListener("click", closeSave);
  el.saveForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const name = el.saveName.value.trim().slice(0, 16) || defaultName();
    mine.unshift({ id: Date.now().toString(36), name, cfg: copyCfg(cfg) });
    mine = mine.slice(0, 20);
    writeStore();
    renderMine();
    closeSave();
  });

  /* ---------- controls ---------- */
  el.primary.addEventListener("click", () => {
    if (status === "idle" || status === "done") start();
    else if (status === "running") pause();
    else if (status === "paused") resume();
  });
  el.skip.addEventListener("click", skip);
  el.reset.addEventListener("click", reset);

  function syncSound() {
    el.sound.setAttribute("aria-pressed", String(soundOn));
    el.sound.textContent = soundOn ? "소리 켜짐" : "소리 꺼짐";
  }
  el.sound.addEventListener("click", () => {
    soundOn = !soundOn;
    if (soundOn) { ensureAudio(); tone(880, 0.1); }
    writeStore();
    syncSound();
  });

  function syncVoice() {
    el.voice.hidden = !synth;
    el.voice.setAttribute("aria-pressed", String(voiceOn));
    el.voice.textContent = voiceOn ? "음성 켜짐" : "음성 꺼짐";
  }
  el.voice.addEventListener("click", () => {
    voiceOn = !voiceOn;
    if (voiceOn) say("음성 안내를 켰어요");
    else hush();
    writeStore();
    syncVoice();
  });

  document.addEventListener("keydown", (e) => {
    if (e.code !== "Space" || e.target.closest("input, button")) return;
    e.preventDefault();
    el.primary.click();
  });

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && status === "running") { holdScreen(); tick(); }
  });

  syncSettings();
  renderMine();
  syncSound();
  syncVoice();
  render();

  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
})();
</script>
</body><!--shell-->
</html><!--shell-->
